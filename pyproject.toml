[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "enrichapi"
version = "0.1.0"
description = "Bibliographic Data Enrichment API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.141.0",
    "pydantic>=2.13.0",
    "lxml>=6.1.0",
    "httpx>=0.27.0",
    "uvicorn[standard]>=0.28.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=6.0.0"
]

# tell setuptools where your code lives
[tool.setuptools.packages.find]
where = ["src"]

# configure pytest settings directly in this file
[tool.pytest.ini_options]
addopts = "--cov=enrichapi --cov-report=term-missing --cov-report=html"
testpaths = ["tests"]

[tool.coverage.run]
source = ["enrichapi"]
omit = [
    "tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    'pragma: no cover',
    'def __repr__',
    'raise NotImplementedError',
    'if __name__ == .__main__.:',
    'if TYPE_CHECKING:',
]